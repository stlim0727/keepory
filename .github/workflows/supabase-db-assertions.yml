name: Supabase DB assertions

# Rebuilds a throwaway Supabase Postgres from supabase/migrations/ and runs the
# assertion scripts under supabase/tests/ against it.
#
# Complements supabase-live-check.yml instead of duplicating it — the two answer
# different questions, and neither covers the other's blind spot:
#   - migration-drift asks "does the LIVE project match the migration files?"
#   - this asks "do the files, replayed from nothing, still satisfy the
#     ownership / quota / capacity invariants?" So it catches a new migration that
#     revokes a grant or adds an ambiguous RPC overload before it merges.
# Issue #996 proves the split matters: production had drifted from the files, so
# a replayed-from-scratch database passes every assertion while the live project
# silently no-op'd AI enrichment. A green run here is NOT evidence about
# production state, and never will be.
#
# Why this does not use `supabase test db`: supabase/tests/*.sql are not pgTAP.
# None of them creates the pgtap extension or emits a TAP plan, so pg_prove
# would have nothing to assert on. Each file is a hand-rolled `begin; ...
# rollback;` script that reports failure with `raise exception 'FAIL: ...'` and
# needs the postgres superuser because it does `set local role
# anon/authenticated/service_role`. psql with ON_ERROR_STOP is the matching
# harness: the first FAIL aborts that file and exits non-zero, and the file's own
# rollback (or the abort) leaves no rows behind.
#
# Why this does not let `supabase start` apply the migrations either. Its first
# real execution failed twice, and both failures are defects in the tracked
# history rather than in this job:
#   - `duplicate key value violates unique constraint "schema_migrations_pkey"`
#     — 20260620000000 is used by two files (ai_enrichment_degraded and
#     ai_enrichment_rate_limit), and the CLI keys local history on the version
#     alone.
#   - `LOCK TABLE can only be used in transaction blocks (SQLSTATE 25P01)` —
#     20261005113906_bookmark_capacity_limits.sql locks at the top of the file,
#     which needs the whole file in one transaction. The Dashboard and the
#     Management API send a file as a single statement, so production never saw
#     either problem; the CLI splits statements and records versions.
# So the job boots the CLI's bootstrap only (migrations staged aside), then
# replays each file itself with psql --single-transaction — the same transport
# shape production actually used. `supabase db reset` on a fresh volume still
# hits both defects until the version is deduped and the lock is wrapped; that
# history work belongs with #996, not to a CI job.
#
# Only the database container starts — the --exclude list below drops auth,
# PostgREST, storage, Studio and the log/edge stack, so nothing here exercises
# Edge Functions or `verify_jwt`. Container boot costs minutes, so triggering is
# deliberately narrow: PRs and post-merge pushes touching migrations, the
# assertion scripts, the local bootstrap config, or this file.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-db-assertions.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-db-assertions.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  assertions:
    name: Assertion scripts on a rebuilt database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned to the CLI whose `supabase start --exclude` surface this workflow
      # was written against. Bump deliberately: a newer CLI can change the
      # bundled database bootstrap, which surfaces here as a replay failure.
      SUPABASE_CLI_VERSION: 2.122.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start the bootstrap database with migrations staged aside
        run: |
          mkdir -p /tmp/replay-migrations
          mv supabase/migrations/*.sql /tmp/replay-migrations/
          supabase start \
            --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          mv /tmp/replay-migrations/*.sql supabase/migrations/
          rmdir /tmp/replay-migrations

      - name: Resolve the local database address
        id: db
        run: |
          # Resolved rather than hardcoded: the local database port moves between
          # CLI versions, and the status line embeds a password placeholder, so
          # only the address is taken from it.
          db_addr="$(supabase status -o env \
            | sed -n 's/^DB_URL=//p' | tr -d '"' \
            | grep -oE '(127\.0\.0\.1|localhost):[0-9]+' | head -n1)"
          if [ -z "$db_addr" ]; then
            echo '::error::could not resolve the local database address from `supabase status`'
            exit 1
          fi
          {
            echo "DB_HOST=${db_addr%%:*}"
            echo "DB_PORT=${db_addr##*:}"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for the database to accept connections
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          PGPASSWORD: postgres
        run: |
          for attempt in $(seq 1 30); do
            if psql -h "$DB_HOST" -p "$DB_PORT" -U postgres -d postgres -X -c 'select 1' > /dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::local database never accepted connections on $DB_HOST:$DB_PORT"
              exit 1
            fi
            sleep 2
          done

      - name: Replay supabase/migrations
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          PGPASSWORD: postgres
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::no migration files found under supabase/migrations/'
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "replaying $file"
            # One transaction per file, which is what the Dashboard and the
            # Management API do. Aborts at the first error: later files depend on
            # earlier ones, so continuing would only add noise.
            psql -h "$DB_HOST" -p "$DB_PORT" -U postgres -d postgres \
              -X -q --single-transaction -v ON_ERROR_STOP=1 -f "$file"
          done
          echo "Replayed ${#files[@]} migration files."

      - name: Run the assertion scripts
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          PGPASSWORD: postgres
        run: |
          shopt -s nullglob
          files=(supabase/tests/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo '::error::no assertion scripts found under supabase/tests/'
            exit 1
          fi
          failed=0
          for file in "${files[@]}"; do
            echo "::group::$file"
            # Deliberately not --single-transaction: each script opens and rolls
            # back its own transaction already.
            if psql -h "$DB_HOST" -p "$DB_PORT" -U postgres -d postgres \
              -X -q -v ON_ERROR_STOP=1 -f "$file"; then
              echo "PASS $file"
            else
              echo "::error::assertion script failed: $file"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Dump the ACLs behind a privilege failure
        if: failure()
        env:
          DB_HOST: ${{ steps.db.outputs.DB_HOST }}
          DB_PORT: ${{ steps.db.outputs.DB_PORT }}
          PGPASSWORD: postgres
        run: |
          # Only runs when an assertion failed, and only reads catalogs. A
          # privilege assertion can fail for two very different reasons — the
          # grant really exists, or function resolution picked another overload —
          # and proacl plus the exact argument list is what tells them apart.
          psql -h "$DB_HOST" -p "$DB_PORT" -U postgres -d postgres -X -v ON_ERROR_STOP=1 <<'SQL'
          select p.proname,
            pg_get_function_arguments(p.oid) as arguments,
            p.proacl,
            has_function_privilege('anon', p.oid, 'EXECUTE') as anon,
            has_function_privilege('authenticated', p.oid, 'EXECUTE') as authenticated,
            has_function_privilege('service_role', p.oid, 'EXECUTE') as service_role
          from pg_proc p join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'public'
            and (p.proname like '%ai_enrichment_slot%' or p.proname like '%enrichment_budget%')
          order by 1, 2;
          SQL
