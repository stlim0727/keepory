name: Android Play Store Release

# Builds a Play-ready Android App Bundle locally on this GitHub Actions runner
# via EAS CLI (`--local`, bypassing EAS cloud build limits and consuming 0 monthly
# quota minutes) and submits it to Google Play using the `submit.production`
# profile already defined in apps/mobile/eas.json (which targets the `internal`
# track — see docs/development/play-store.md for the internal -> closed ->
# production promotion sequence).
#
# Manual dispatch only. This intentionally does NOT trigger on tag push like
# .github/workflows/android-apk.yml does: that workflow builds a debug-signed
# sideload APK for testers, this one publishes to a real Google Play track,
# so it must never fire as a side effect of cutting a build elsewhere.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   EXPO_TOKEN                 an Expo access token (expo.dev -> Account ->
#                               Access tokens) for non-interactive `eas` auth and
#                               production keystore credential retrieval.
#   PLAY_SERVICE_ACCOUNT_JSON  full contents of the Google Play publisher
#                               service-account JSON key referenced by
#                               eas.json's `submit.production.android.serviceAccountKeyPath`.
#
# Optional build-time app config via repo secrets (passed to the local runner):
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_SENTRY_DSN,
#   SENTRY_AUTH_TOKEN, EXPO_PUBLIC_POSTHOG_API_KEY, EXPO_PUBLIC_POSTHOG_HOST,
#   EXPO_PUBLIC_POSTHOG_FULL_SDK_ENABLED, EXPO_PUBLIC_GOOGLE_SERVICES_BASE64,
#   EXPO_PUBLIC_EAS_PROJECT_ID
#
# Google Play's submit API rejects a listing that has never received a
# manual upload — per docs/development/play-store.md, the very first AAB for
# a new Play Console app must be uploaded by hand (Play Console -> internal
# testing) before this workflow's submit can succeed. Only re-dispatch
# this workflow after that one-time bootstrap upload.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. v1.0.0 or v1.0.0-rc1). Blank = app.json version.'
        required: false
        default: ''

concurrency:
  group: android-playstore
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # workflow_dispatch lets the dispatcher pick any branch/tag as the run's
      # ref (independent of any `inputs`), and that ref is what gets checked
      # out and shipped to Play below — so guard it here rather than trusting
      # the UI/API caller. Mirrors android-apk.yml's release-branch rule
      # (docs/development/branching.md): only `main` or a `release/*` line.
      - name: Restrict to approved release refs
        run: |
          if [ "${{ github.ref_name }}" != "main" ] && [[ "${{ github.ref_name }}" != release/* ]]; then
            echo "::error::Refusing to build+submit to Play from ref '${{ github.ref_name }}' — dispatch this workflow from 'main' or a 'release/*' branch only (see docs/development/branching.md)."
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # Synchronize version with latest APK/Release builds, enforce minimum version guard,
      # configure eas.json production profile, and generate Play Store release notes.
      # Profile env reaches both the local CLI and the remote EAS worker.
      # Keep remote versionCode auto-increment independent of the app version.
      - name: Prepare EAS release and Play Store notes
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/prepare-eas-release.mjs

      - run: pnpm install --frozen-lockfile

      # Same gate as CI: fail fast before spending EAS build minutes and a
      # Play upload slot on broken code.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:components

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''

      # Restore Gradle deps/transforms + local build cache to speed up native compile.
      - name: Restore Gradle cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Written next to eas.json at the exact relative path its
      # `serviceAccountKeyPath` expects, and removed unconditionally after
      # the submit step so the key never lingers on the runner.
      - name: Write Play publisher service account key
        working-directory: apps/mobile
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > keepory-play-publisher-service-account.json
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      # Builds the release AAB locally on the runner machine: consumes 0 EAS cloud build quota.
      - name: EAS local build (production)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_POSTHOG_FULL_SDK_ENABLED: ${{ secrets.EXPO_PUBLIC_POSTHOG_FULL_SDK_ENABLED }}
          EXPO_PUBLIC_GOOGLE_SERVICES_BASE64: ${{ secrets.EXPO_PUBLIC_GOOGLE_SERVICES_BASE64 }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_GIT_REF: ${{ github.ref_name }}
          EXPO_PUBLIC_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          pnpm dlx eas-cli build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output keepory-production.aab

      # Submit the locally built AAB to Google Play Console.
      - name: EAS submit to Play
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx eas-cli submit \
            --platform android \
            --profile production \
            --path keepory-production.aab \
            --non-interactive

      # Upload the production AAB artifact for release provenance & emergency backup.
      - name: Upload production AAB artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: keepory-production-aab
          path: apps/mobile/keepory-production.aab
          if-no-files-found: ignore

      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}

      - name: Remove Play publisher service account key
        if: always()
        working-directory: apps/mobile
        run: rm -f keepory-play-publisher-service-account.json
