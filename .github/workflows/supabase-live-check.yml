name: Supabase live check

# Post-merge/scheduled health checks against the LIVE production Supabase
# project — separate from the ci.yml/CircleCI gate, which never touches
# production. Exists because STASH-5V/5T/5W traced back to a migration
# (20260712000000_realtime_broadcast_policies.sql) that was merged to main
# but never applied to production: nothing caught the drift until users hit
# the resulting Realtime failure in the wild.
#
# Two independent jobs:
#   - migration-drift: compares supabase/migrations/*.sql against what the
#     Management API says is actually applied. Read-only, no data created, so
#     it's safe to run unattended on a schedule. Needs a SUPABASE_ACCESS_TOKEN
#     secret (a Supabase *account* personal access token, Dashboard ->
#     Account -> Access Tokens — not the project anon/service key), scoped to
#     this project with Migrations -> Read only; that permission unlocks the
#     single GET this job makes and cannot execute SQL. Skips
#     itself with a clear message if that secret isn't set yet.
#   - verify-supabase: runs the existing `pnpm verify:supabase` E2E script
#     (auth + Realtime checks against the real project, including a
#     channel-join check per account type) using the EXPO_PUBLIC_SUPABASE_*
#     secrets plus SUPABASE_SECRET_KEY, which is an environment secret on
#     `supabase-live` and therefore needs a human approval per run. This alone
#     would have caught the Realtime bug.
#     Deliberately workflow_dispatch-only, NOT scheduled. It creates throwaway
#     anonymous + real accounts (and bookmarks, tags, collections) in production
#     on every run, and the service-role key lets it delete exactly those accounts
#     via the Admin API — cleanups run in a `finally`, so an aborted run still
#     tidies up. What it cannot survive is a hard kill (the 10-minute job timeout
#     or a runner loss), which leaves the auth users behind for
#     `cleanup_anonymous_users` to reap only if the run died before creating any
#     bookmark/collection/tag rows for them. So a scheduled run writes to prod
#     auth daily and can leave residue; wire it to a schedule only as a deliberate
#     decision, not as a side effect of this PR.
#
# migration-drift runs on a schedule (safety net) and right after anything
# touching supabase/migrations/ merges to main (fast feedback), plus manual
# dispatch. Independent of the CI_PROVIDER gate switch — this isn't ported to
# CircleCI (whose scheduler doesn't work for this project; see
# docs/development/ci-circleci.md).
#
# This is the "does production match the files" half. The other half,
# supabase-db-assertions.yml, rebuilds a database from those files and checks the
# invariants in supabase/tests/ against it; neither covers the other's blind spot.

on:
  schedule:
    - cron: '30 5 * * *' # nightly, offset from the Firebase cleanup at 04:17
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check for unapplied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: node scripts/check-migration-drift.mjs

  check-verify-secrets:
    # Job-level `if:` can't reference `secrets` directly (not a valid context
    # there — GitHub rejects the whole workflow file with a parse error, which
    # silently failed every run, on every branch, regardless of trigger).
    # Do the check in a step instead and expose it via `needs` for the real job.
    #
    # SUPABASE_SECRET_KEY is deliberately NOT checked here: it lives in the
    # `supabase-live` environment, and environment secrets are only exposed to
    # jobs that declare that environment, so this job would always see it empty
    # and gate the real job off. A missing key is caught instead by the script's
    # own first check (`✗ service-role credential`), which fails loudly.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$EXPO_PUBLIC_SUPABASE_URL" ] && [ -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
          fi

  verify-supabase:
    # Manual only — see the "deliberately workflow_dispatch-only" note above.
    # Also skips (whole job, no runner spent) when the secrets aren't set.
    needs: check-verify-secrets
    if: needs.check-verify-secrets.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    # The service-role key bypasses RLS for every user's rows, so it is not a
    # repository secret: it exists only in this environment, and the environment
    # requires an explicit approval before the job starts. A pushed branch or a
    # fork PR therefore cannot read it, and the job cannot run unattended.
    environment: supabase-live
    # The script normally finishes in well under a minute; without this,
    # a hang (e.g. a lingering Realtime socket keeping Node's event loop
    # alive) burns a runner for up to GitHub's 6h default job timeout.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify live Supabase behavior
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: pnpm verify:supabase
