version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # React and its renderers require exactly matching versions at runtime.
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
          - react-test-renderer
